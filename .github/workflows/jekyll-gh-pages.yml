# Workflow to build and deploy the dexpay-landing project to GitHub Pages
name: Deploy DexPay Landing to GitHub Pages

on:
  # Run on pushes to the gh-pages branch
  push:
    branches: ["gh-pages"]

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# Permissions for the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Ensure only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # You can adjust this to match your project's requirements

      - name: Install dependencies
        run: npm install # Or yarn install, if you are using yarn

      - name: Build
        run: npm run build # Or yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # or ./build if you changed the build directory

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
